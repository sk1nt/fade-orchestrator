name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Provenance sweep
        # No internal ticket ids, dated measurement diaries, `file:line` pointers or private repo
        # paths may ship. Timestamps inside fixtures are DATA; a date written as prose is a hit.
        # The literals use a character class so this step's own text cannot match the pattern it
        # enforces.
        run: |
          ! grep -rnE '\bY[0-9]{1,2}\b|2026-1[01]-|monoli[h]|deploy/o[m]p|fade[o]theworld|fade-f[a]bric|[a-z]+\.ts:? [0-9]{2,4}' src test docs README.md demo .github package.json --exclude-dir=out --exclude-dir=node_modules
      - name: Typecheck
        run: npm run typecheck
      # OMP loads src/*.ts directly, so this is the bundle the publish loop ships: esbuild must emit
      # a non-empty dist/index.js.
      - name: Build and prove the committed bundle
        run: |
          npm run build
          test -s dist/index.js
          git diff --exit-code -- dist/index.js
      - name: Unit tests
        run: npm test
      # The gate rig drives the whole phase protocol against a FAKE router on an ephemeral port:
      # no omp CLI, no basalt, no provider — so it is a real CI gate, not a host-only rig. It is
      # the file that proves the single-load-at-agent_end rule, the verifier sandbox, the turn
      # ledger and the flip guard.
      - name: Gate rig (fake router, no host needed)
        run: npm run test:gate
      # The single-lane rig proves the mode a box with one pack's worth of RAM runs in:
      # `FADE_ORCHESTRATE_THINK_LANE == FADE_ORCHESTRATE_CODE_LANE`, the resident entry. Every
      # landing then pays ZERO `POST /v1/load`, and it is the landing's ROLE — not the lane — that
      # chooses the tool set, the thinking level and the briefing, so the coder keeps its writers
      # and the verifier keeps the read-only set. Host-less, like the gate rig.
      - name: Single-lane rig (one lane, zero swaps)
        run: npm run test:lane
      # The shipped status surface is ONE line on the top widget, with the Alt+F panel as the detail
      # screen; the line's placement is load-bearing for the transcript, so a regression fails CI.
      - name: The status line ships on the top widget
        run: |
          grep -q 'setWidget(TOP_WIDGET_KEY' src/index.ts
          grep -q 'export const TOP_WIDGET_KEY' src/ui.ts
          # Every `setStatus` in the one writer (`src/index.ts`) must sit behind a surface guard: the
          # status BAR is the documented opt-in (`FADE_ORCHESTRATE_SURFACE=status`, README +
          # docs/OVERLAY.md), and the top widget is the default. A write outside those guards paints
          # the host's footer on a surface the user never chose. This is a deliberate line-distance
          # tripwire a host-less CI can run; the real assertion is the rpc rig's frame check in
          # `test/rpc_rig.mjs` (zero status-bar rows on the default surface, on a live host).
          bash -c 'guards=$(grep -n -E "if \(statusWritten\)|SURFACE === .status." src/index.ts | cut -d: -f1); test -n "$guards" || { echo "no status-surface guard found"; exit 1; }; for l in $(grep -n "setStatus(ORCH_STATUS_KEY" src/index.ts | cut -d: -f1); do ok=0; for g in $guards; do if [ "$l" -gt "$g" ] && [ $((l - g)) -le 8 ]; then ok=1; fi; done; if [ "$ok" != 1 ]; then echo "unguarded setStatus at line $l"; exit 1; fi; done; echo "setStatus guarded: $(grep -c "setStatus(ORCH_STATUS_KEY" src/index.ts) call sites, guards at $(echo $guards | tr " " ,)"'
      # The rpc and pty rigs need the omp CLI, tmux and a provider, so they run on a host that owns a
      # basalt router: `FADE_ORCHESTRATE_LIVE_SMOKE=1 npm run test:rpc`, `npm run test:pty`.
